<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Portal Register</title>
<link rel="stylesheet" href="../tracker.css">
<style>
  .form_question { margin-bottom: 14px; } .form_label { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .form_responses select.part { width: auto; display: inline-block; margin-right: 6px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; } fieldset label { margin-right: 14px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  #done { display: none; }
</style>
</head>
<body>
<header><b>Practice University — Graduate Admissions</b><span class="sub">Practice only. Nothing you type leaves this tab.</span></header>
<main>
  <div class="msg">Like the UCI registration page: an account form on a Slate-style portal.</div>
  <form id="f" onsubmit="event.preventDefault(); document.getElementById('done').style.display='block'; document.body.dataset.submitted='yes';">
    <h2>Register for an account</h2>
  <div class="form_question"><div class="form_label"><label for="email">Email Address <span class="req">*</span></label></div>
    <div class="form_responses"><input id="email" name="email" type="email" required></div></div>
  <div class="form_question"><div class="form_label"><label for="first">First Name <span class="req">*</span></label></div>
    <div class="form_responses"><input id="first" name="first" type="text" required></div></div>
  <div class="form_question"><div class="form_label"><label for="last">Last Name <span class="req">*</span></label></div>
    <div class="form_responses"><input id="last" name="last" type="text" required></div></div>
  <div class="form_question"><div class="form_label"><label for="bm">Birthdate <span class="req">*</span></label></div>
    <div class="form_responses"><select id="bm" name="bm" class="part" required><option value=""></option><option value='1'>January</option><option value='2'>February</option><option value='3'>March</option><option value='4'>April</option><option value='5'>May</option><option value='6'>June</option><option value='7'>July</option><option value='8'>August</option><option value='9'>September</option><option value='10'>October</option><option value='11'>November</option><option value='12'>December</option></select><select name="bd" class="part" aria-label="Birthdate day" required><option value=""></option><option value='1'>1</option><option value='2'>2</option><option value='3'>3</option><option value='4'>4</option><option value='5'>5</option><option value='6'>6</option><option value='7'>7</option><option value='8'>8</option><option value='9'>9</option><option value='10'>10</option><option value='11'>11</option><option value='12'>12</option><option value='13'>13</option><option value='14'>14</option><option value='15'>15</option><option value='16'>16</option><option value='17'>17</option><option value='18'>18</option><option value='19'>19</option><option value='20'>20</option><option value='21'>21</option><option value='22'>22</option><option value='23'>23</option><option value='24'>24</option><option value='25'>25</option><option value='26'>26</option><option value='27'>27</option><option value='28'>28</option><option value='29'>29</option><option value='30'>30</option><option value='31'>31</option></select><select name="by" class="part" aria-label="Birthdate year" required><option value=""></option><option value='2010'>2010</option><option value='2009'>2009</option><option value='2008'>2008</option><option value='2007'>2007</option><option value='2006'>2006</option><option value='2005'>2005</option><option value='2004'>2004</option><option value='2003'>2003</option><option value='2002'>2002</option><option value='2001'>2001</option><option value='2000'>2000</option><option value='1999'>1999</option><option value='1998'>1998</option><option value='1997'>1997</option><option value='1996'>1996</option><option value='1995'>1995</option><option value='1994'>1994</option><option value='1993'>1993</option><option value='1992'>1992</option><option value='1991'>1991</option><option value='1990'>1990</option><option value='1989'>1989</option><option value='1988'>1988</option><option value='1987'>1987</option><option value='1986'>1986</option><option value='1985'>1985</option><option value='1984'>1984</option><option value='1983'>1983</option><option value='1982'>1982</option><option value='1981'>1981</option><option value='1980'>1980</option><option value='1979'>1979</option><option value='1978'>1978</option><option value='1977'>1977</option><option value='1976'>1976</option><option value='1975'>1975</option><option value='1974'>1974</option><option value='1973'>1973</option><option value='1972'>1972</option><option value='1971'>1971</option><option value='1970'>1970</option><option value='1969'>1969</option><option value='1968'>1968</option><option value='1967'>1967</option><option value='1966'>1966</option><option value='1965'>1965</option><option value='1964'>1964</option><option value='1963'>1963</option><option value='1962'>1962</option><option value='1961'>1961</option><option value='1960'>1960</option><option value='1959'>1959</option><option value='1958'>1958</option><option value='1957'>1957</option><option value='1956'>1956</option><option value='1955'>1955</option><option value='1954'>1954</option><option value='1953'>1953</option><option value='1952'>1952</option><option value='1951'>1951</option></select></div></div>
  <div class="form_question"><div class="form_label"><label for="cit">Country of Citizenship <span class="req">*</span></label></div>
    <div class="form_responses"><select id="cit" name="cit" required><option value=""></option><option value="IN">India</option><option value="CN">China</option><option value="US">United States</option></select></div></div>
  <div class="form_question"><div class="form_label"><label for="pw">Password <span class="req">*</span></label></div>
    <div class="form_responses"><input id="pw" name="pw" type="password" required></div></div>
  <div class="form_question"><div class="form_label"><label for="pw2">Confirm Password <span class="req">*</span></label></div>
    <div class="form_responses"><input id="pw2" name="pw2" type="password" required></div></div>
    <div class="form_question"><label><input type="checkbox" name="tos" required> I agree to the terms of use</label></div>
    <div class="dlg-actions"><button class="primary" type="submit">Create Account</button>
      <a class="button" href="apply.html">Skip to practice application →</a></div>
    <div id="done" class="msg">Practice account “created” — nothing was sent anywhere.</div>
  </form>
</main>
</body>
</html>

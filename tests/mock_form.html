<!doctype html><html><body>
<form id="f" onsubmit="document.body.dataset.submitted='yes'; return false;">
 <div class="form_question"><div class="form_label">First Name *</div><div class="form_responses"><input name="fn" required></div></div>
 <div class="form_question"><div class="form_label">Middle Name</div><div class="form_responses"><input name="mn"></div></div>
 <label for="ln">Last / Family Name</label><input id="ln" name="ln" required>
 <label for="dob">Date of Birth (mm/dd/yyyy)</label><input id="dob" name="dob">
 <label for="em">Email Address</label><input id="em" name="em" type="email">
 <label for="ctry">Country of Citizenship</label>
 <select id="ctry"><option value=""></option><option value="IN">India</option><option value="US">United States</option></select>
 <fieldset><legend>Are you a U.S. citizen?</legend>
  <label><input type="radio" name="usc" value="Y"> Yes</label><label><input type="radio" name="usc" value="N"> No</label></fieldset>
 <label for="eth">Are you Hispanic or Latino?</label><input id="eth" name="eth">
 <label for="gpa">Cumulative GPA</label><input id="gpa" name="gpa" maxlength="4">
 <label for="inst">Institution Name</label><input id="inst" name="inst">
 <label for="fav">Favourite colour</label><input id="fav" name="fav" required>
 <label for="cv">Upload Resume / CV</label><input id="cv" type="file">
 <button type="button">Save &amp; Continue</button>
 <button type="submit">Submit Application</button>
</form></body></html>
